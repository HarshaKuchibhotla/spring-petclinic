version: '3.8'

services:

  app:
    build: .
    container_name: petclinic-app
    ports:
      - "8080:8080"

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: petclinic-tests
    depends_on:
      - app
    environment:
      - baseUrl=http://app:8080
    volumes:
    - ./reports:/app/target/site
